version: '3.8'
services:
  booking-app:
    build: .
    container_name: ${CONTAINER_NAME:-booking-app}
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      - DATABASE_URL=file:/app/data/database.sqlite
    volumes:
      - ${DATA_DIR:-./data}:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /app/node_modules/.prisma
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
